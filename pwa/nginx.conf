server {
    listen 80;

    # En producción esta app vive en fabbric.aivance.cloud/stock (servicio
    # propio en EasyPanel, Domain=fabbric.aivance.cloud + Path=/stock).
    # Confirmado en vivo (2026-08-23): a diferencia de lo asumido al
    # principio, EasyPanel/Traefik NO le saca el prefijo /stock antes de
    # reenviar al contenedor — llega tal cual, hay que manejarlo acá.
    # vite.config.ts usa base:"/stock/" en build, así que TODAS las
    # referencias a assets/manifest del HTML ya vienen con ese prefijo.

    location = /stock {
        return 301 /stock/;
    }

    # Tiene que ir ANTES de "location /stock/": las location por regex se
    # evalúan en orden de aparición y ganan sobre el prefijo más largo si
    # matchean, así que si no separamos esto se resuelve como archivo estático
    # dentro de /stock (no existe ahí, physical root no tiene subcarpeta stock)
    # y devuelve 404 en vez de application/manifest+json.
    location ~ ^/stock/.*\.webmanifest$ {
        root /usr/share/nginx/html;
        rewrite ^/stock/(.*)$ /$1 break;
        default_type application/manifest+json;
    }

    location /stock/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /stock/index.html;
    }

    # Acceso directo sin el prefijo /stock (ej. el host automático que asigna
    # EasyPanel) — no es la URL real de producción, pero sirve algo en vez de
    # rotos silenciosos si alguien entra ahí por error.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location ~* \.webmanifest$ {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
    }
}
